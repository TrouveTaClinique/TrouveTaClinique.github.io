# Worker d'aiguillage IA de la page /guides/ de trouvetaclinique.ca.
# Déploiement : Cloudflare Workers Builds, répertoire racine « workers/aiguillage ».
# Secret à ajouter dans Cloudflare (jamais ici) : ANTHROPIC_API_KEY.
name = "trouvetaclinique-aiguillage"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Modèle Claude utilisé. Claude Sonnet 5 : environ 1 ¢ US par question en mode hybride.
MODELE = "claude-sonnet-5"
# Sites autorisés à interroger le service.
ORIGINES = "https://trouvetaclinique.ca,https://apercu.trouvetaclinique.ca"
# Plafond de questions par jour pour tout le site (heure du Québec). Actif seulement quand
# l'espace KV COMPTEUR ci-dessous est relié ; sans lui, le service fonctionne comme avant.
PLAFOND_JOUR = "150"
# Adresse d'expédition du formulaire « Nous joindre » (domaine où Email Routing est activé).
CONTACT_EXPEDITEUR = "formulaire@trouvetaclinique.ca"

# Compteur du plafond quotidien (audit P03). Créer l'espace dans Cloudflare
# (Storage & Databases > KV > Create, nom « aiguillage-compteur »), puis retirer les « # »
# des trois lignes suivantes et y inscrire son identifiant (ce n'est pas un secret).
# [[kv_namespaces]]
# binding = "COMPTEUR"
# id = "IDENTIFIANT_DE_L_ESPACE_KV"

# 5 questions par minute par visiteur.
[[ratelimits]]
name = "LIMITE_VISITEUR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# 20 questions par minute pour l'ensemble du site.
[[ratelimits]]
name = "LIMITE_GLOBALE"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60

# Formulaire « Nous joindre » (page À propos) : envoi direct par Cloudflare Email Routing.
# Tant que ce bloc reste en commentaire, la page prépare le courriel dans le logiciel du visiteur.
# Mise en place : README, section « Formulaire Nous joindre ». Le destinataire est un secret
# (CONTACT_DESTINATION) ajouté dans Cloudflare, jamais ici.
# [[send_email]]
# name = "COURRIEL"
