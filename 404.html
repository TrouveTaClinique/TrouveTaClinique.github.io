<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — PTEM 2027, Cliniques en recrutement</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<style>
  :root { --navy:#0F2240; --blue:#0080D7; --teal:#08A0A0; --mint:#7EE6DF; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:32px 20px 46px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; background:var(--navy); position:relative;
    overflow-x:hidden; }
  .grid, .glow { position:fixed; inset:0; pointer-events:none; }
  .grid { background-image:linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size:34px 34px; }
  .glow { background:radial-gradient(circle at 50% 38%, rgba(14,165,233,.16), transparent 62%); }
  .box { position:relative; max-width:520px; }
  img.pin { width:104px; height:104px; display:block; margin:0 auto 22px;
    filter:drop-shadow(0 12px 22px rgba(14,165,233,.45)); }
  h1 { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:800; font-size:22px; letter-spacing:.02em; }
  .code { font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:800; font-size:13px; letter-spacing:.22em;
    background:linear-gradient(90deg,var(--blue),var(--teal),var(--mint));
    -webkit-background-clip:text; background-clip:text; color:var(--mint); margin-bottom:10px; }
  @supports ((-webkit-background-clip:text) or (background-clip:text)) { .code { color:transparent; } }
  p { font-size:14.5px; line-height:1.65; color:#B7C6D9; margin:14px 0 26px; }
  a.cta { display:inline-block; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; font-size:14px;
    letter-spacing:.03em; color:#fff; text-decoration:none; padding:13px 26px; border-radius:999px;
    background:linear-gradient(90deg,var(--blue),var(--teal)); }
  a.cta:hover { filter:brightness(1.09); }
  .sig { position:fixed; left:0; right:0; bottom:0; height:6px;
    background:linear-gradient(90deg,var(--blue),var(--teal),var(--mint)); }
  footer { position:relative; margin-top:30px; font-size:11.5px; letter-spacing:.1em;
    text-transform:uppercase; color:#7C8DA3; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-weight:700; }
</style>
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="box">
    <img class="pin" src="/icon-512.png" alt="">
    <div class="code">Erreur 404</div>
    <h1>Cette page n'existe pas</h1>
    <p>L'adresse demandée est introuvable. Elle a peut-être changé,
       ou comporte une faute de frappe.</p>
    <a class="cta" href="/">Retour à l’accueil</a>
  </div>
  <footer>PTEM 2027 · Recrutement médical — Montérégie</footer>
  <div class="sig"></div>
</body>
</html>
