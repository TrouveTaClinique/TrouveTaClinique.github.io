<style>
  :root { --navy:#0F2240; --blue:#0080D7; --teal:#08A0A0; --mint:#7EE6DF; }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:32px 20px 46px;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#fff; background:var(--navy); position:relative;
    overflow-x:hidden; }
  .grid, .glow { position:fixed; inset:0; pointer-events:none; }
  .grid { background-image:linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px); background-size:34px 34px; }
  .glow { background:radial-gradient(circle at 50% 38%, rgba(14,165,233,.16), transparent 62%); }
  .box { position:relative; max-width:520px; overflow:visible; }

  .code-row { display:flex; align-items:flex-end; justify-content:center; gap:4px; margin-bottom:8px; }
  .digit { font-weight:800; font-size:88px; line-height:1;
    background:linear-gradient(90deg,var(--blue),var(--teal),var(--mint));
    -webkit-background-clip:text; background-clip:text; color:var(--mint); }
  @supports ((-webkit-background-clip:text) or (background-clip:text)) { .digit { color:transparent; } }

  .bounce-slot { position:relative; width:70px; height:88px; }

  .zero { position:absolute; left:0; right:0; bottom:0; text-align:center;
    transform-origin:bottom center;
    animation: crush .16s ease-in 1.5s forwards; }
  @keyframes crush {
    0%   { transform:scaleY(1);    opacity:1; }
    70%  { transform:scaleY(.12);  opacity:1; }
    100% { transform:scaleY(.02);  opacity:0; }
  }

  .shadow { position:absolute; bottom:2px; left:50%; margin-left:-23px; width:46px; height:7px;
    border-radius:50%; background:rgba(126,230,223,.22); filter:blur(1px); opacity:0;
    animation: shadowIn .12s ease-out 1.5s forwards, shadowPulse .9s 1.66s infinite; }
  @keyframes shadowIn { to { opacity:.5; } }
  @keyframes shadowPulse {
    0%   { transform:scale(1); opacity:.5; animation-timing-function:ease-out; }
    45%  { transform:scale(.72); opacity:.22; animation-timing-function:ease-in; }
    100% { transform:scale(1); opacity:.5; }
  }

  img.pin { position:absolute; bottom:0; left:50%; margin-left:-33px; width:66px; height:66px;
    background:transparent; filter:drop-shadow(0 6px 10px rgba(14,165,233,.35));
    transform-origin:bottom center;
    animation: fall .56s cubic-bezier(.55,0,1,1) 1s both,
               bounce .9s 1.56s infinite; }
  @keyframes fall {
    0%   { transform:translateY(-140vh) scaleY(1); }
    88%  { transform:translateY(0) scaleY(1); }
    94%  { transform:translateY(0) scaleY(.45); }
    100% { transform:translateY(0) scaleY(.92); }
  }
  @keyframes bounce {
    0%   { transform:translateY(0) scaleY(.92); animation-timing-function:ease-out; }
    45%  { transform:translateY(-16px) scaleY(1.03); animation-timing-function:ease-in; }
    100% { transform:translateY(0) scaleY(.92); }
  }

  .code { font-weight:800; font-size:13px; letter-spacing:.22em;
    color:#7C8DA3; margin-bottom:14px; text-transform:uppercase; }
  h1 { font-weight:800; font-size:22px; letter-spacing:.02em; }
  p { font-size:14.5px; line-height:1.65; color:#B7C6D9; margin:14px 0 26px; }
  a.cta { display:inline-block; font-weight:700; font-size:14px;
    letter-spacing:.03em; color:#fff; text-decoration:none; padding:13px 26px; border-radius:999px;
    background:linear-gradient(90deg,var(--blue),var(--teal)); }
  a.cta:hover { filter:brightness(1.09); }
  .sig { position:fixed; left:0; right:0; bottom:0; height:6px;
    background:linear-gradient(90deg,var(--blue),var(--teal),var(--mint)); }
  footer { position:relative; margin-top:30px; font-size:11.5px; letter-spacing:.1em;
    text-transform:uppercase; color:#7C8DA3; font-weight:700; }
</style>
